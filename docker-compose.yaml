#
# Deploy elizaOS anywhere
# https://github.com/bealers/elizify
#
services:
  elizaos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elizaos
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      elizaos-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOG_LEVEL: info

      POSTGRES_URL: postgresql://eliza:eliza_password@elizaos-db:5432/eliza?sslmode=disable&connect_timeout=10

      # Endpoint security
      ELIZA_SERVER_AUTH_TOKEN: ${ELIZA_SERVER_AUTH_TOKEN:-production-token}
      ELIZA_UI_ENABLE: ${ELIZA_UI_ENABLE:-false}

      HOST: 0.0.0.0
      API_PORT: 3000
      CHARACTER_FILE: ${CHARACTER_FILE:-/app/config/characters/elliot.character.json}

      # Performance settings
      MAX_MEMORY_USAGE: 1024
      RATE_LIMIT_REQUESTS: 1000
      RATE_LIMIT_WINDOW: 900000

    volumes:
      - eliza_data:/app/data
      - eliza_logs:/app/logs

    networks:
      - elizaos_network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  elizaos-db:
    image: pgvector/pgvector:pg15
    container_name: elizaos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eliza
      POSTGRES_PASSWORD: eliza_password
      POSTGRES_DB: eliza
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
      POSTGRES_MAX_CONNECTIONS: 200

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    ports:
      - "5432:5432"

    networks:
      - elizaos_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eliza"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  eliza_data:
    driver: local
  eliza_logs:
    driver: local
  postgres_data:
    driver: local

networks:
  elizaos_network:
    name: elizaos_network
    driver: bridge